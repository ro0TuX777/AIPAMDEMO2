# AIPAM V2 CI Pipeline (§14.13)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

env:
  AIPAM_API_TOKEN: test-token-ci
  PYTHON_VERSION: "3.11"

jobs:
  # ── PR checks ──────────────────────────────────────────
  unit-tests:
    name: Unit + Contract Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the multi-GB ML dependency install.
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: make test-unit
      - run: make test-contract
      - run: make test-api
      - run: make test-worker
      - run: make test-sse
      - run: make test-sensor-contract

  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the multi-GB ML dependency install.
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements.txt
      # requirements.txt lists ruff unpinned (>=0.4), so CI would otherwise pull
      # whatever is newest and lint against rules the codebase predates — a moving
      # target that fails the build on ruff upgrades unrelated to any change. Pin
      # to the version the project is developed against; bump deliberately.
      - run: pip install ruff==0.15.6
      # mypy is not in requirements; install it (pinned) so `make check` actually
      # type-checks instead of silently reporting "mypy not installed".
      - run: pip install mypy==2.3.0
      - run: make lint
      - run: make check

  # ── Merge-to-main checks ───────────────────────────────
  integration:
    name: Integration Tests (Golden PCAPs)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, lint]
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the multi-GB ML dependency install.
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: make test-integration
      - run: make test-smoke

  # ── Playwright E2E ──────────────────────────────────────
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: [unit-tests, lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start dev server & run tests
        run: |
          npx vite --port 5173 &
          # Wait for dev server to be ready (up to 30s)
          for i in $(seq 1 30); do curl -sf http://localhost:5173 >/dev/null 2>&1 && break || sleep 1; done
          npx playwright test --reporter=list --grep-invert="@requires-backend"
        env:
          E2E_BASE_URL: http://localhost:5173

  # ── Nightly checks ─────────────────────────────────────
  nightly:
    name: Nightly (Parity + Benchmark)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the multi-GB ML dependency install.
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: make test-parity
      - run: make benchmark

