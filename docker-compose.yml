services:
  backend:
    build: ./backend
    image: aipam-app:latest
    container_name: aipam-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-trafficllm-v10
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
      # V2 API auth token
      - AIPAM_API_TOKEN=test-token-v2
      - AIPAM_DB_PATH=/data/aipam.db
      - AIPAM_UPLOAD_ROOT=/data/uploads
      - AIPAM_JOB_ROOT=/data/jobs
      - AIPAM_OLLAMA_URL=http://host.docker.internal:11434
      - AIPAM_REDIS_URL=redis://redis:6379/0
      # Host workspace root — used to translate Docker paths to host paths
      # when dispatching training jobs to the host-native GPU trainer.
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-.}
    volumes:
      - aipam_data:/data
      - aipam_rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - ./finetuning:/data/finetuning
      - ${EXTERNAL_DATA_PATH:-/Volumes}:/external_data # Configurable external drive mount
      - arkime_import_queue:/import-queue
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    image: aipam-app:latest
    container_name: aipam-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "backend.app.worker", "worker", "-l", "info", "--concurrency=1"]
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-trafficllm-v10
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      - C_FORCE_ROOT=true
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
      # Host-native fine-tuning (MLX on Apple Silicon)
      - HOST_TRAINER_URL=http://host.docker.internal:8002
      # V2 API auth token
      - AIPAM_API_TOKEN=test-token-v2
      - AIPAM_DB_PATH=/data/aipam.db
      - AIPAM_UPLOAD_ROOT=/data/uploads
      - AIPAM_JOB_ROOT=/data/jobs
      - AIPAM_OLLAMA_URL=http://host.docker.internal:11434
      - AIPAM_REDIS_URL=redis://redis:6379/0
    volumes:
      - aipam_data:/data
      - aipam_rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - ./finetuning:/data/finetuning
      - ${EXTERNAL_DATA_PATH:-/Volumes}:/external_data # Configurable external drive mount
      - arkime_import_queue:/import-queue
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_TOKEN: test-token-v2
    image: aipam-frontend:latest
    container_name: aipam-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine
    container_name: aipam-redis
    volumes:
      - redis_data:/data

  # Ollama runs on host - using host.docker.internal:11434
  # To run Ollama in Docker instead, uncomment below and comment out LLM_ENDPOINT changes above
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: aipam-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  # TrafficLLM Service (Optional - requires NVIDIA GPU)
  # To enable: docker-compose --profile trafficllm up
  # NOTE: This service requires an NVIDIA GPU. Skip if using Apple Silicon.
  # For Apple Silicon, use the fine-tuning pipeline instead (see finetuning/README.md)
  trafficllm:
    build: ./trafficllm
    container_name: aipam-trafficllm
    profiles:
      - trafficllm
    ports:
      - "8001:8001"
    volumes:
      # Mount local models directory with pre-downloaded models
      - ./trafficllm/models:/app/models
    environment:
      - TRAFFICLLM_MODEL_PATH=/app/models/chatglm2-6b
      - TRAFFICLLM_PEFT_PATH=/app/models/peft
      - TRAFFICLLM_PORT=8001
    # NVIDIA GPU support enabled
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ============================================
  # OpenSearch (Arkime metadata store)
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aipam-opensearch
    profiles: ["arkime"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # ============================================
  # Arkime Initialization (one-shot bootstrap)
  # ============================================
  arkime-init:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-init
    profiles: ["arkime"]
    command: >
      /bin/bash -c "
        echo 'Waiting for OpenSearch...';
        until curl -sf http://opensearch:9200/_cluster/health; do sleep 2; done;
        echo 'Initializing Arkime DB...';
        /opt/arkime/db/db.pl --insecure http://opensearch:9200 init --ifneeded;
        echo 'Adding admin user...';
        /opt/arkime/bin/arkime_add_user.sh admin 'Admin' '${ARKIME_ADMIN_PASSWORD:-changeme}' --admin --insecure || true;
        echo 'Arkime init complete.';
      "
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime_raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy

  # ============================================
  # Arkime Viewer (analyst UI + API)
  # ============================================
  arkime-viewer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-viewer
    profiles: ["arkime"]
    command: /opt/arkime/bin/docker.sh viewer
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    ports:
      - "${ARKIME_VIEWER_PORT:-8005}:8005"
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime_raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Arkime Importer (offline PCAP import)
  # ============================================
  arkime-importer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-importer
    profiles: ["arkime"]
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    entrypoint: /bin/bash
    command: >
      -c "
        echo 'Arkime importer ready — watching /import-queue';
        while true; do
          for manifest in /import-queue/*.json; do
            [ -f \"$$manifest\" ] || continue;
            pcap=$$(jq -r '.pcap_path' \"$$manifest\");
            job_id=$$(jq -r '.job_id // empty' \"$$manifest\");
            if [ -n \"$$pcap\" ] && [ -f \"$$pcap\" ]; then
              echo \"Importing $$pcap (job $$job_id)\";
              if /opt/arkime/bin/capture -r \"$$pcap\" --copy 2>&1; then
                mv \"$$manifest\" \"$$manifest.done\";
                if [ -n \"$$job_id\" ] && [ -d \"/data/jobs/$$job_id\" ]; then
                  remaining=$$(ls /import-queue/$${job_id}_*.json 2>/dev/null | wc -l);
                  if [ \"$$remaining\" -eq 0 ]; then
                    echo '{\"status\":\"imported\",\"imported_at\":\"'$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)'\"}' > /data/jobs/$$job_id/arkime_import_status.json;
                    echo \"Import complete for job $$job_id\";
                  fi;
                fi;
              else
                echo \"FAILED: $$pcap\";
                if [ -n \"$$job_id\" ] && [ -d \"/data/jobs/$$job_id\" ]; then
                  echo '{\"status\":\"failed\"}' > /data/jobs/$$job_id/arkime_import_status.json;
                fi;
                mv \"$$manifest\" \"$$manifest.failed\";
              fi;
            fi;
          done;
          sleep 5;
        done
      "
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime_raw:/opt/arkime/raw
      - arkime_import_queue:/import-queue
      - aipam_data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aipam_data:
  aipam_rules:
  redis_data:
  ollama_data:
  trafficllm_models:
  opensearch_data:
  arkime_raw:
  arkime_import_queue:
