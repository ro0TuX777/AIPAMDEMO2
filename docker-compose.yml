# AIPAM Docker Compose — Single Source of Truth
#
# Core stack:
#   docker compose up -d
#
# With Arkime (optional packet investigation):
#   docker compose --profile arkime up -d
#
# With TrafficLLM (optional — requires NVIDIA GPU):
#   docker compose --profile trafficllm up -d
#
# Configuration:
#   cp .env.example .env   # edit with your settings
#
# Volumes:
#   aipam-data          — SQLite DB + file storage
#   aipam-jobs          — Job folders (PCAPs, sensor outputs, artifacts)
#   aipam-uploads       — Uploaded PCAPs awaiting validation
#   aipam-rules         — Suricata/YARA rules
#   aipam-logs          — Application logs
#   aipam-sensor-config — Sensor configuration
#   ollama-models       — Ollama model storage
#   redis-data          — Celery broker + SSE buffer
#   opensearch-data     — Arkime session metadata (profile: arkime)
#   arkime-raw          — Arkime-managed PCAP storage (profile: arkime)
#   arkime-import-queue — PCAP import manifests (profile: arkime)

services:
  # ============================================
  # API Server (FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    image: aipam-app:latest
    container_name: aipam-api
    # Runs as root (image default) to match the Celery worker, which must be root
    # for Docker-socket access. Both share the /data volume — including the
    # ChromaDB vector store that the API and worker both write — so a single UID
    # avoids permission conflicts (a non-root API couldn't open a root-owned
    # store, breaking KB indexing and chat RAG). Acceptable for this single-VM,
    # air-gapped deployment where the two already share root-writable volumes.
    command: ["uvicorn", "backend.app.main_v2:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      AIPAM_DB_PATH: /data/aipam.db
      # V1 SQLModel data (settings, partial job results, chat) shares this
      # persistent DB with V2 — without it, DATABASE_URL defaults to an ephemeral
      # per-container ./aipam.db, so partial results never reach the API.
      DATABASE_URL: sqlite:////data/aipam.db
      AIPAM_JOB_ROOT: /jobs
      AIPAM_UPLOAD_ROOT: /uploads
      AIPAM_REDIS_URL: redis://redis:6379/0
      AIPAM_OLLAMA_URL: ${AIPAM_OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-aipam-trafficllm-v10}
      VECTOR_STORE_PATH: /data/vector_store
      MNEMOS_ENABLED: ${MNEMOS_ENABLED:-true}
      MNEMOS_BASE_URL: http://mnemos-service:8700
      MNEMOS_TOKEN: ${MNEMOS_TOKEN:-}
    volumes:
      - aipam-data:/data
      - aipam-jobs:/jobs
      - aipam-uploads:/uploads
      - aipam-logs:/opt/aipam/logs
      - aipam-rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - arkime-import-queue:/import-queue
    extra_hosts:
      - "so-standalone:172.16.0.15"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mnemos-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Worker (Celery — pipeline orchestrator)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
    image: aipam-app:latest
    container_name: aipam-worker
    command: ["celery", "-A", "backend.app.worker", "worker", "--loglevel=info", "--concurrency=1"]
    env_file: .env
    environment:
      AIPAM_DB_PATH: /data/aipam.db
      # V1 SQLModel data (settings, partial job results, chat) shares this
      # persistent DB with V2 — without it, DATABASE_URL defaults to an ephemeral
      # per-container ./aipam.db, so partial results never reach the API.
      DATABASE_URL: sqlite:////data/aipam.db
      AIPAM_JOB_ROOT: /jobs
      AIPAM_UPLOAD_ROOT: /uploads
      AIPAM_REDIS_URL: redis://redis:6379/0
      AIPAM_OLLAMA_URL: ${AIPAM_OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-aipam-trafficllm-v10}
      AIPAM_SENSOR_CONFIG_DIR: /opt/aipam/sensor-config
      C_FORCE_ROOT: "true"
      MNEMOS_ENABLED: ${MNEMOS_ENABLED:-true}
      MNEMOS_BASE_URL: http://mnemos-service:8700
      MNEMOS_TOKEN: ${MNEMOS_TOKEN:-}
    volumes:
      - aipam-data:/data
      - aipam-jobs:/jobs
      - aipam-uploads:/uploads
      - aipam-logs:/opt/aipam/logs
      - aipam-rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - aipam-sensor-config:/opt/aipam/sensor-config:ro
      - arkime-import-queue:/import-queue
      - /var/run/docker.sock:/var/run/docker.sock  # sensor containers
    extra_hosts:
      - "so-standalone:172.16.0.15"
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      mnemos-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      # Override Dockerfile healthcheck — worker has no HTTP server
      test: ["CMD-SHELL", "celery -A backend.app.worker inspect ping --destination celery@$$HOSTNAME 2>/dev/null | grep -q OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Frontend (Vite build served by nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Legacy build-time token (still honoured as the last-resort fallback
        # in main.tsx).  The container entrypoint writes runtime-config.js
        # from $AIPAM_API_TOKEN at start-up, so rotating the token in .env
        # and restarting the frontend container is enough — no rebuild.
        VITE_API_TOKEN: ${AIPAM_API_TOKEN}
    image: aipam-frontend:latest
    container_name: aipam-frontend
    env_file: .env
    environment:
      AIPAM_API_TOKEN: ${AIPAM_API_TOKEN}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aipam-net

  # ============================================
  # Redis (Celery broker + SSE event buffer)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aipam-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # MNEMOS forensic vector memory (AIPAM-owned)
  # ============================================
  mnemos-qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: aipam-mnemos-qdrant
    volumes:
      - mnemos-qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - aipam-net

  mnemos-postgres:
    image: postgres:16-alpine
    container_name: aipam-mnemos-postgres
    environment:
      POSTGRES_DB: mnemos
      POSTGRES_USER: mnemos
      POSTGRES_PASSWORD: ${MNEMOS_POSTGRES_PASSWORD:-mnemos}
    volumes:
      - mnemos-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemos -d mnemos"]
      interval: 10s
      timeout: 5s
      retries: 5

  mnemos-service:
    build:
      context: ./mnemos-service
    image: aipam-mnemos-service:27a4c963
    container_name: aipam-mnemos-service
    ports:
      - "1888:8700"
    environment:
      MNEMOS_PORT: 8700
      MNEMOS_TOKEN: ${MNEMOS_TOKEN:-}
      MNEMOS_TIERS: qdrant
      MNEMOS_QDRANT_URL: http://mnemos-qdrant:6333
      MNEMOS_QDRANT_COLLECTION: aipam_forensic_memory
      MNEMOS_POSTGRES_DSN: postgresql://mnemos:${MNEMOS_POSTGRES_PASSWORD:-mnemos}@mnemos-postgres:5432/mnemos
      MNEMOS_AUDIT_ENABLED: "true"
      MNEMOS_GPU_DEVICE: ${MNEMOS_GPU_DEVICE:-cpu}
      MNEMOS_TIMESFM_ENABLED: "false"
      MNEMOS_PULSE_ACTIONS: off
      MNEMOS_GOVERNANCE_MODE: advisory
      MNEMOS_SERVICE_REVISION: 27a4c96308156e468ff5272f5afd843ed9ea172d
    volumes:
      - mnemos-data:/app/data
      - mnemos-model-cache:/root/.cache/huggingface
    depends_on:
      mnemos-qdrant:
        condition: service_started
      mnemos-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ============================================
  # Ollama (LLM inference — local model serving)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: aipam-ollama
    runtime: nvidia
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - aipam-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # TrafficLLM (Optional — requires NVIDIA GPU)
  # To enable: docker compose --profile trafficllm up -d
  # ============================================
  trafficllm:
    build: ./trafficllm
    container_name: aipam-trafficllm
    profiles:
      - trafficllm
    ports:
      - "8001:8001"
    volumes:
      - ./trafficllm/models:/app/models
    environment:
      - TRAFFICLLM_MODEL_PATH=/app/models/chatglm2-6b
      - TRAFFICLLM_PEFT_PATH=/app/models/peft
      - TRAFFICLLM_PORT=8001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - aipam-net

  # ============================================
  # OpenSearch (Arkime metadata store)
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aipam-opensearch
    profiles: ["arkime"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ============================================
  # Arkime Initialization (one-shot bootstrap)
  # ============================================
  arkime-init:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-init
    profiles: ["arkime"]
    command: >
      /bin/bash -c "
        echo 'Waiting for OpenSearch...';
        until curl -sf http://opensearch:9200/_cluster/health; do sleep 2; done;
        echo 'Initializing Arkime DB...';
        /opt/arkime/db/db.pl --insecure http://opensearch:9200 init --ifneeded;
        echo 'Adding admin user...';
        /opt/arkime/bin/arkime_add_user.sh admin 'Admin' '${ARKIME_ADMIN_PASSWORD:-changeme}' --admin --insecure || true;
        echo 'Arkime init complete.';
      "
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - aipam-net

  # ============================================
  # Arkime Viewer (analyst UI + API)
  # ============================================
  arkime-viewer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-viewer
    profiles: ["arkime"]
    command: /opt/arkime/bin/docker.sh viewer
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    ports:
      - "${ARKIME_VIEWER_PORT:-8005}:8005"
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/api/eshealth || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Arkime Importer (offline PCAP import)
  # ============================================
  arkime-importer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-importer
    profiles: ["arkime"]
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    entrypoint: /bin/bash
    command: >
      -c "
        echo 'Arkime importer ready — watching /import-queue';
        while true; do
          for manifest in /import-queue/*.json; do
            [ -f \"$$manifest\" ] || continue;
            pcap=$$(grep -o '\"pcap_path\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' \"$$manifest\" | sed 's/.*:.*\"\\(.*\\)\"/\\1/');
            job_id=$$(grep -o '\"job_id\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' \"$$manifest\" | sed 's/.*:.*\"\\(.*\\)\"/\\1/');
            if [ -n \"$$pcap\" ] && [ -f \"$$pcap\" ]; then
              echo \"Importing $$pcap (job $$job_id)\";
              if /opt/arkime/bin/capture -r \"$$pcap\" --copy 2>&1; then
                mv \"$$manifest\" \"$$manifest.done\";
                if [ -n \"$$job_id\" ] && [ -d \"/jobs/$$job_id\" ]; then
                  remaining=$$(ls /import-queue/$${job_id}_*.json 2>/dev/null | wc -l);
                  if [ \"$$remaining\" -eq 0 ]; then
                    echo '{\"status\":\"imported\",\"imported_at\":\"'$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)'\"}' > /jobs/$$job_id/arkime_import_status.json;
                    echo \"Import complete for job $$job_id\";
                  fi;
                fi;
              else
                echo \"Capture failed for $$pcap\";
                if [ -n \"$$job_id\" ] && [ -d \"/jobs/$$job_id\" ]; then
                  echo '{\"status\":\"failed\"}' > /jobs/$$job_id/arkime_import_status.json;
                fi;
                mv \"$$manifest\" \"$$manifest.failed\";
              fi;
            fi;
          done;
          sleep 5;
        done
      "
    volumes:
      - ./deploy/arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
      - arkime-import-queue:/import-queue
      - aipam-jobs:/jobs
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net

# ============================================
# Volumes
# ============================================
volumes:
  aipam-data:
    driver: local
  aipam-jobs:
    driver: local
  aipam-uploads:
    driver: local
  aipam-logs:
    driver: local
  aipam-sensor-config:
    driver: local
  aipam-rules:
    driver: local
  ollama-models:
    driver: local
  redis-data:
    driver: local
  mnemos-data:
    driver: local
  mnemos-model-cache:
    driver: local
  mnemos-qdrant-data:
    driver: local
  mnemos-postgres-data:
    driver: local
  # Arkime volumes (used only when arkime profile is active)
  opensearch-data:
    driver: local
  arkime-raw:
    driver: local
  arkime-import-queue:
    driver: local

# ============================================
# Network (isolated bridge)
# ============================================
networks:
  aipam-net:
    driver: bridge
