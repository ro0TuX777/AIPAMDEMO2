services:
  backend:
    build: ./backend
    container_name: aipam-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://ollama:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-cybersec-llm
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
    volumes:
      - aipam_data:/data
    depends_on:
      - redis
      - ollama
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    container_name: aipam-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info"]
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://ollama:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-cybersec-llm
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      - C_FORCE_ROOT=true
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
    volumes:
      - aipam_data:/data
    depends_on:
      - redis
      - ollama

  frontend:
    build: ./frontend
    container_name: aipam-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  redis:
    image: redis:7-alpine
    container_name: aipam-redis
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: aipam-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # TrafficLLM Service (Optional - requires NVIDIA GPU)
  # To enable: docker-compose --profile trafficllm up
  # NOTE: This service requires an NVIDIA GPU. Skip if using Apple Silicon.
  # For Apple Silicon, use the fine-tuning pipeline instead (see finetuning/README.md)
  trafficllm:
    build: ./trafficllm
    container_name: aipam-trafficllm
    profiles:
      - trafficllm
    ports:
      - "8001:8001"
    volumes:
      # Mount local models directory with pre-downloaded models
      - ./trafficllm/models:/app/models
    environment:
      - TRAFFICLLM_MODEL_PATH=/app/models/chatglm2-6b
      - TRAFFICLLM_PEFT_PATH=/app/models/peft
      - TRAFFICLLM_PORT=8001
    # NVIDIA GPU support enabled
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  aipam_data:
  redis_data:
  ollama_data:
  trafficllm_models:

