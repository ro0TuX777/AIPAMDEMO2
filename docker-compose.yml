services:
  backend:
    build: ./backend
    container_name: aipam-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-trafficllm-v8
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
      # V2 API auth token
      - AIPAM_API_TOKEN=test-token-v2
      - AIPAM_DB_PATH=/data/aipam.db
      - AIPAM_UPLOAD_ROOT=/data/uploads
      - AIPAM_JOB_ROOT=/data/jobs
      - AIPAM_OLLAMA_URL=http://host.docker.internal:11434
      - AIPAM_REDIS_URL=redis://redis:6379/0
      # Host workspace root — used to translate Docker paths to host paths
      # when dispatching training jobs to the host-native GPU trainer.
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-.}
    volumes:
      - aipam_data:/data
      - aipam_rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - ./finetuning:/data/finetuning
      - ${EXTERNAL_DATA_PATH:-/Volumes}:/external_data # Configurable external drive mount
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    container_name: aipam-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "backend.app.worker", "worker", "-l", "info", "--concurrency=1"]
    environment:
      - DATABASE_URL=sqlite:////data/aipam.db
      - FILE_STORAGE_PATH=/data/storage
      - REDIS_URL=redis://redis:6379/0
      - LLM_ENDPOINT=http://host.docker.internal:11434/v1/chat/completions
      - LLM_MODEL_NAME=aipam-trafficllm-v8
      - LLM_PROVIDER=ollama
      - LLM_MAX_TOKENS=8000
      - C_FORCE_ROOT=true
      # TrafficLLM integration (connects to host-running TrafficLLM)
      - TRAFFICLLM_ENDPOINT=http://host.docker.internal:8001/v1/chat/completions
      - USE_TRAFFICLLM_FOR_DETECTION=true
      # Host-native fine-tuning (MLX on Apple Silicon)
      - HOST_TRAINER_URL=http://host.docker.internal:8002
      # V2 API auth token
      - AIPAM_API_TOKEN=test-token-v2
      - AIPAM_DB_PATH=/data/aipam.db
      - AIPAM_UPLOAD_ROOT=/data/uploads
      - AIPAM_JOB_ROOT=/data/jobs
      - AIPAM_OLLAMA_URL=http://host.docker.internal:11434
      - AIPAM_REDIS_URL=redis://redis:6379/0
    volumes:
      - aipam_data:/data
      - aipam_rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - ./finetuning:/data/finetuning
      - ${EXTERNAL_DATA_PATH:-/Volumes}:/external_data # Configurable external drive mount
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_TOKEN: test-token-v2
    container_name: aipam-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine
    container_name: aipam-redis
    volumes:
      - redis_data:/data

  # Ollama runs on host - using host.docker.internal:11434
  # To run Ollama in Docker instead, uncomment below and comment out LLM_ENDPOINT changes above
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: aipam-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  # TrafficLLM Service (Optional - requires NVIDIA GPU)
  # To enable: docker-compose --profile trafficllm up
  # NOTE: This service requires an NVIDIA GPU. Skip if using Apple Silicon.
  # For Apple Silicon, use the fine-tuning pipeline instead (see finetuning/README.md)
  trafficllm:
    build: ./trafficllm
    container_name: aipam-trafficllm
    profiles:
      - trafficllm
    ports:
      - "8001:8001"
    volumes:
      # Mount local models directory with pre-downloaded models
      - ./trafficllm/models:/app/models
    environment:
      - TRAFFICLLM_MODEL_PATH=/app/models/chatglm2-6b
      - TRAFFICLLM_PEFT_PATH=/app/models/peft
      - TRAFFICLLM_PORT=8001
    # NVIDIA GPU support enabled
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  aipam_data:
  aipam_rules:
  redis_data:
  ollama_data:
  trafficllm_models:
