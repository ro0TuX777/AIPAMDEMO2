title: Encoded PowerShell Command
id: aipam-encoded-powershell
status: experimental
description: Detects PowerShell invoked with an encoded command, commonly used to obfuscate malicious payloads.
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - 'FromBase64String'
  condition: selection_img and selection_flag
tags:
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Administrative scripts that legitimately use encoded commands
