title: Suspicious LOLBin Network Download
id: aipam-lolbin-download
status: experimental
description: Detects living-off-the-land binaries used to download remote payloads (certutil, bitsadmin, mshta).
level: high
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '-urlcache'
  condition: selection
tags:
  - attack.command_and_control
  - attack.t1105
falsepositives:
  - Legitimate software deployment tooling
