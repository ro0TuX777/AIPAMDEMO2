# BlueScrub Attribution rules — does the source point back to its author?
rules:
  - id: bluescrub.attribution.build-path-leak
    languages: [generic]
    severity: WARNING
    message: >-
      Absolute build path embedded in source or config. PDB and build paths
      routinely carry an operator username, an internal hostname, or a project
      codename.
    metadata:
      cwe: ["CWE-200: Exposure of Sensitive Information"]
      confidence: MEDIUM
      bluescrub_family: build-path-leak
      bluescrub_detector: regex_pattern
    pattern-regex: >-
      (?:[A-Z]:\\Users\\[^\\\s"']+|/home/[^/\s"']+|/Users/[^/\s"']+)[\\/][^\s"']*

  - id: bluescrub.attribution.operator-todo
    languages: [generic]
    severity: INFO
    message: >-
      Developer note left in shipped code. Handles, initials, and internal
      ticket ids in comments are attribution material.
    metadata:
      confidence: LOW
      # Not attribution-identity. That family defaults to critical, which
      # disqualifies an artifact outright — and this rule fires on a bare
      # "# TODO:". Measured: a two-line file containing one TODO comment and
      # one DEBUG print came back grade F, disqualified. Development metadata
      # that shipped is exactly what metadata-leak is for, and the per-rule
      # severity in severity_table.py puts it at info.
      bluescrub_family: metadata-leak
      # A `pattern-regex` rule is a regex matcher. Classing it with semgrep's
      # AST rules exempted it from the ceiling that exists to stop a regex
      # match disqualifying anything.
      bluescrub_detector: regex_pattern
    pattern-regex: >-
      (?i)(?://|#|/\*)\s*(?:TODO|FIXME|HACK|XXX|NOTE)\s*[\(\[:@]\s*[A-Za-z][\w.\-]{1,30}
