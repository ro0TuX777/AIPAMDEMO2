[project]
name = "aipam-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "celery",
    "redis",
    "httpx",
    "python-multipart",
    "scapy",
    "jinja2",
    "numpy",
    "pydantic",
    # RAG / vector store
    "lancedb>=0.6.0",
    "pyarrow>=14.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
