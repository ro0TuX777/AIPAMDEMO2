[project]
name = "aipam-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "celery",
    "redis",
    "httpx",
    "python-multipart",
    # Phase 1: RAG Chat dependencies
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true

