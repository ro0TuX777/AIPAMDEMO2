# AIPAM V2 Production Docker Compose
#
# Full stack: API, Worker, Frontend, Redis, Ollama
# Air-gapped deployment — no external network dependencies.
#
# Usage:
#   cp .env.example .env   # edit with your AIPAM_API_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d
#
# With Arkime (optional packet investigation):
#   docker compose -f deploy/docker-compose.yml --profile arkime up -d
#
# Volumes:
#   aipam-data        — SQLite DB + logs
#   aipam-jobs        — Job folders (PCAPs, sensor outputs, artifacts)
#   aipam-uploads     — Uploaded PCAPs awaiting validation
#   ollama-models     — Ollama model storage
#   redis-data        — Celery broker + SSE buffer
#   opensearch-data   — Arkime session metadata (profile: arkime)
#   arkime-raw        — Arkime-managed PCAP storage (profile: arkime)
#   arkime-import-queue — PCAP import manifests (profile: arkime)

services:
  # ============================================
  # API Server (FastAPI)
  # ============================================
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: aipam-app:latest
    container_name: aipam-api
    user: aipam
    command: ["uvicorn", "backend.app.main_v2:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      AIPAM_DB_PATH: /data/aipam.db
      AIPAM_JOB_ROOT: /jobs
      AIPAM_UPLOAD_ROOT: /uploads
      AIPAM_REDIS_URL: redis://redis:6379/0
      AIPAM_OLLAMA_URL: http://ollama:11434
      LLM_MODEL_NAME: aipam-trafficllm-v9
      LLM_ENDPOINT: http://ollama:11434/v1/chat/completions
      VECTOR_STORE_PATH: /data/vector_store
    volumes:
      - aipam-data:/data
      - aipam-jobs:/jobs
      - aipam-uploads:/uploads
      - aipam-logs:/opt/aipam/logs
      - aipam-rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - arkime-import-queue:/import-queue
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/docs"]
      # Note: /docs is unauthenticated; for authenticated health use:
      # test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $AIPAM_API_TOKEN", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # Worker (Celery — pipeline orchestrator)
  # ============================================
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: aipam-app:latest
    container_name: aipam-worker
    command: ["celery", "-A", "backend.app.worker", "worker", "--loglevel=info", "--concurrency=1"]
    env_file: .env
    environment:
      AIPAM_DB_PATH: /data/aipam.db
      AIPAM_JOB_ROOT: /jobs
      AIPAM_UPLOAD_ROOT: /uploads
      AIPAM_REDIS_URL: redis://redis:6379/0
      AIPAM_OLLAMA_URL: http://ollama:11434
      LLM_MODEL_NAME: aipam-trafficllm-v9
      LLM_ENDPOINT: http://ollama:11434/v1/chat/completions
      AIPAM_SENSOR_CONFIG_DIR: /opt/aipam/sensor-config
      C_FORCE_ROOT: "true"
    volumes:
      - aipam-data:/data
      - aipam-jobs:/jobs
      - aipam-uploads:/uploads
      - aipam-logs:/opt/aipam/logs
      - aipam-rules:/opt/aipam/rules
      - ./ti:/opt/aipam/ti:ro
      - aipam-sensor-config:/opt/aipam/sensor-config:ro
      - /var/run/docker.sock:/var/run/docker.sock  # sensor containers
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net

  # ============================================
  # Frontend (Vite build served by nginx)
  # ============================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_TOKEN: ${AIPAM_API_TOKEN}
    image: aipam-frontend:latest
    container_name: aipam-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aipam-net

  # ============================================
  # Redis (Celery broker + SSE event buffer)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aipam-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # Ollama (LLM inference — local model serving)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: aipam-ollama
    # Port 11434 not exposed to host — accessed via internal network only
    # Uncomment if you need host access: ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - aipam-net
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # OpenSearch (Arkime metadata store)
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aipam-opensearch
    profiles: ["arkime"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ============================================
  # Arkime Initialization (one-shot bootstrap)
  # ============================================
  arkime-init:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-init
    profiles: ["arkime"]
    command: >
      /bin/bash -c "
        echo 'Waiting for OpenSearch...';
        until curl -sf http://opensearch:9200/_cluster/health; do sleep 2; done;
        echo 'Initializing Arkime DB...';
        /opt/arkime/db/db.pl --insecure http://opensearch:9200 init --ifneeded;
        echo 'Adding admin user...';
        /opt/arkime/bin/arkime_add_user.sh admin 'Admin' '${ARKIME_ADMIN_PASSWORD:-changeme}' --admin --insecure || true;
        echo 'Arkime init complete.';
      "
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - aipam-net

  # ============================================
  # Arkime Viewer (analyst UI + API)
  # ============================================
  arkime-viewer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-viewer
    profiles: ["arkime"]
    command: /opt/arkime/bin/docker.sh viewer
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    ports:
      - "${ARKIME_VIEWER_PORT:-8005}:8005"
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Arkime Importer (offline PCAP import)
  # ============================================
  arkime-importer:
    image: ${ARKIME_IMAGE:-ghcr.io/arkime/arkime/arkime:v6-latest}
    container_name: aipam-arkime-importer
    profiles: ["arkime"]
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    entrypoint: /bin/bash
    command: >
      -c "
        echo 'Arkime importer ready — watching /import-queue';
        while true; do
          for manifest in /import-queue/*.json; do
            [ -f \"$$manifest\" ] || continue;
            pcap=$$(grep -o '\"pcap_path\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' \"$$manifest\" | sed 's/.*:.*\"\\(.*\\)\"/\\1/');
            job_id=$$(grep -o '\"job_id\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' \"$$manifest\" | sed 's/.*:.*\"\\(.*\\)\"/\\1/');
            if [ -n \"$$pcap\" ] && [ -f \"$$pcap\" ]; then
              echo \"Importing $$pcap (job $$job_id)\";
              if /opt/arkime/bin/capture -r \"$$pcap\" --copy 2>&1; then
                mv \"$$manifest\" \"$$manifest.done\";
                if [ -n \"$$job_id\" ] && [ -d \"/jobs/$$job_id\" ]; then
                  remaining=$$(ls /import-queue/$${job_id}_*.json 2>/dev/null | wc -l);
                  if [ \"$$remaining\" -eq 0 ]; then
                    echo '{\"status\":\"imported\",\"imported_at\":\"'$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)'\"}' > /jobs/$$job_id/arkime_import_status.json;
                    echo \"Import complete for job $$job_id\";
                  fi;
                fi;
              else
                echo \"Capture failed for $$pcap\";
                if [ -n \"$$job_id\" ] && [ -d \"/jobs/$$job_id\" ]; then
                  echo '{\"status\":\"failed\"}' > /jobs/$$job_id/arkime_import_status.json;
                fi;
                mv \"$$manifest\" \"$$manifest.failed\";
              fi;
            fi;
          done;
          sleep 5;
        done
      "
    volumes:
      - ./arkime/config.ini:/opt/arkime/etc/config.ini:ro
      - arkime-raw:/opt/arkime/raw
      - arkime-import-queue:/import-queue
      - aipam-jobs:/jobs
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipam-net

# ============================================
# Volumes
# ============================================
volumes:
  aipam-data:
    driver: local
  aipam-jobs:
    driver: local
  aipam-uploads:
    driver: local
  aipam-logs:
    driver: local
  aipam-sensor-config:
    driver: local
  ollama-models:
    driver: local
  aipam-rules:
    driver: local
  redis-data:
    driver: local
  # Arkime volumes (used only when arkime profile is active)
  opensearch-data:
    driver: local
  arkime-raw:
    driver: local
  arkime-import-queue:
    driver: local

# ============================================
# Network (isolated bridge)
# ============================================
networks:
  aipam-net:
    driver: bridge

