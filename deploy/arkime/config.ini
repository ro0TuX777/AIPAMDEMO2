# ============================================
# AIPAM Arkime Configuration
# ============================================
# Shared config for Arkime viewer, capture, and importer services.
# Mounted into containers at /opt/arkime/etc/config.ini
#
# This is an MVP configuration for single-VM deployment.
# For production-scale deployments, tune OpenSearch heap,
# retention, and consider a dedicated Arkime VM.

[default]

# --- OpenSearch connection ---
elasticsearch=http://opensearch:9200
# Prefix for Arkime indices in OpenSearch
prefix=arkime_

# --- Viewer settings ---
viewPort=8005
viewHost=0.0.0.0

# --- Node identity ---
# Each capture/import node should have a unique name.
# For the single-VM MVP, one node name is sufficient.
node=aipam-node

# --- PCAP storage ---
# Raw PCAP files are stored here after import.
# This should be a dedicated volume with adequate space.
pcapDir=/opt/arkime/raw
# Maximum free space (in %) before Arkime stops writing
freeSpaceG=5%

# --- Session metadata ---
# Enable community_id generation for pivot correlation
# This is the PRIMARY pivot key used by AIPAM
plugins=community_id.so

# --- Performance tuning (MVP — conservative) ---
maxPacketsInQueue=200000
dbBulkSize=300000
# Packet threads for capture/import
packetThreads=2

# --- Security ---
# Disable in MVP single-VM deployment (internal network only).
# For production, enable HTTPS and authentication.
webBasePath=/
passwordSecret=CHANGE_ME_IN_PRODUCTION

# --- Retention (MVP) ---
# Automatically delete PCAP files older than N days.
# Set conservatively for single-VM to avoid filling disk.
# 0 = no automatic deletion
deleteAfterDays=0

# --- Import-specific settings ---
# When running in offline/import mode (-r flag), copy PCAPs
# to pcapDir so Arkime manages them.
copyPcap=yes

# --- Misc ---
compressES=false
maxFileSizeG=2

